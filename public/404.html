<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página no encontrada — MyWorld</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14131B">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/marca/favicon-32.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;--bg:#14131B;--panel:#1E1C28;--line:#332E44;--text:#FFF4F4;--muted:#B9AEC8;--coral:#F5697E;--onCoral:#14131B;--mira:#B9AEE0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Figtree,system-ui,sans-serif;font-size:17px;line-height:1.5;display:grid;place-items:center;padding:24px}
main{max-width:30rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
img{image-rendering:pixelated;width:144px;height:192px}
h1{font-family:Literata,Georgia,serif;font-weight:600;font-size:clamp(26px,5vw,34px);letter-spacing:-0.015em;text-wrap:balance}
p{color:var(--muted);max-width:34ch}
.acts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
a{display:inline-flex;align-items:center;min-height:44px;padding:10px 20px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px}
.pri{background:var(--coral);color:var(--onCoral)}
.sec{border:1px solid var(--line);color:var(--text)}
a:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--mira);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/mira/mira_uy.png" alt="Mira, sorprendida" width="96" height="128">
  <h1>Esta página no está en el mapa.</h1>
  <p>Puede que el enlace esté mal escrito o que la página ya no exista. Tus historias siguen a salvo en tu escritorio.</p>
  <div class="acts">
    <a class="pri" href="/app">Ir a mi escritorio</a>
    <a class="sec" href="/">Volver al inicio</a>
  </div>
</main>
</body>
</html>
